server.port=8082
spring.application.name=doctor-service

# Kết nối PostgreSQL (Cần tạo sẵn DB doctor_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/doctor_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update

# Đăng ký vào Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.searchDoctorLimit.limit-for-period=5
resilience4j.ratelimiter.instances.searchDoctorLimit.limit-refresh-period=10s
resilience4j.ratelimiter.instances.searchDoctorLimit.timeout-duration=0

logging.level.io.github.resilience4j=DEBUG
